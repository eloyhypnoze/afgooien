:root {
  --bg0: #050a1a;
  --bg1: #0a1634;
  --panel: rgba(22, 28, 44, .92);
  --panel2: #1d2436;
  --panel3: #252e44;
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(255, 255, 255, .14);
  --text: #f1f4fa;
  --muted: #8e98ad;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #f05252;
  --accent: #2f6bff;
  --accent2: #1f52d6;
  --hot1: #7a2ff0;
  --hot2: #e8336f;
  --radius: 16px;
  --display: "AfgDisplay", "AfgInter", system-ui, sans-serif;
  --ui: 1.35;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--text); background: var(--bg0);
  font: 15px/1.45 "AfgInter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow-x: hidden;
}
.bgfx {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(47, 107, 255, .22), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(122, 47, 240, .18), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg0) 70%);
}
.bgfx::after {
  content: ""; position: absolute; right: -8%; top: 6%; width: 46vw; height: 9vw; border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,182,72,.0), rgba(255,61,127,.16), rgba(47,107,255,.10));
  transform: rotate(-14deg); filter: blur(30px);
}
.hidden { display: none !important; }
button {
  font: inherit; color: inherit; cursor: pointer; border-radius: 12px; padding: .65em 1.1em;
  border: 1px solid var(--line2); background: var(--panel2); transition: background .15s, border-color .15s, transform .1s;
}
button:hover { background: var(--panel3); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .38; cursor: default; transform: none; }
button.primary { background: linear-gradient(180deg, #3b78ff, var(--accent2)); border-color: transparent; color: #fff; font-weight: 700; }
button.primary:hover { background: linear-gradient(180deg, #4a83ff, #2659e0); }
button.ghost { background: transparent; }
button.ghost:hover { background: rgba(255,255,255,.06); }
button.wide { width: 100%; }
kbd { font: 600 .68em "AfgInter", sans-serif; opacity: .65; margin-left: .45em; border: 1px solid currentColor; border-radius: 5px; padding: .05em .35em; }
input, select {
  font: inherit; color: var(--text); background: #12182a; border: 1px solid var(--line2);
  border-radius: 10px; padding: .6em .8em; width: 100%;
}
input:focus, select:focus { outline: 2px solid rgba(47,107,255,.6); outline-offset: 1px; }
.sub { color: var(--muted); margin: .2rem 0 .8rem; }
.sub.small { font-size: .85rem; margin: .7rem 0 0; }
.err { color: var(--bad); min-height: 1.3em; }

/* ---------- navigatie */
.topnav {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
  padding: .55rem 1.3rem; background: rgba(8, 12, 24, .85); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 12;
}
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--text); justify-self: start; }
.logo { width: 38px; height: 38px; }
.wordmark { font: 900 italic 1.45rem/1 var(--display); letter-spacing: .01em; display: flex; flex-direction: column; }
.wordmark small { font: 700 .55rem/1.4 "AfgInter", sans-serif; letter-spacing: .32em; color: var(--muted); font-style: normal; }
.mainnav { display: flex; gap: .3rem; }
.navlink { border: 0; background: none; font-weight: 700; font-size: 1.02rem; color: #b7c0d3; padding: .55em .9em; border-radius: 10px; position: relative; }
.navlink:hover { color: #fff; background: rgba(255,255,255,.05); }
.navlink.active { color: #fff; }
.navlink.active::after { content: ""; position: absolute; left: .9em; right: .9em; bottom: -.62rem; height: 3px; border-radius: 3px; background: #fff; }
.status { display: flex; gap: .5rem; align-items: center; justify-self: end; }
.iconbtn { padding: .45em .7em; background: transparent; border-color: var(--line2); }
.pill { font-size: .8rem; padding: .3em .8em; border-radius: 99px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line2); white-space: nowrap; }
.pill.ok { color: var(--good); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
.pill.bad { color: var(--warn); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
.zoom { display: inline-flex; }
.zoom button:first-child { border-radius: 10px 0 0 10px; }
.zoom button:last-child { border-radius: 0 10px 10px 0; border-left: 0; }

main { flex: 1; min-height: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.3rem 2rem; }
.pagetitle { font: 900 italic clamp(1.9rem, 4vw, 2.8rem)/1 var(--display); text-transform: uppercase; margin: .2rem 0 1.2rem; display: flex; align-items: center; gap: .6rem; letter-spacing: -.005em; }
.pt-mark { width: .75em; height: .75em; border-radius: 50%; background: conic-gradient(from 200deg, #ffb648, #ff3d7f, #4f8cff, #ffb648); box-shadow: 0 0 18px rgba(255,61,127,.45); flex: none; }
.section { font: 900 italic 1.3rem/1 var(--display); text-transform: uppercase; margin: 1.8rem 0 .8rem; color: #e7ebf5; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem 1.3rem; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .6rem; }
.cardhead h2 { margin: 0; font: 900 italic 1.35rem/1 var(--display); text-transform: uppercase; }
.countpill { font-size: .8rem; font-weight: 700; color: var(--muted); background: var(--panel2); border-radius: 99px; padding: .25em .7em; }
.tag { font-size: .75rem; font-weight: 700; padding: .25em .7em; border-radius: 99px; white-space: nowrap; }
.tag-party { color: #e9f23a; background: rgba(233,242,58,.12); }
.tag-soon { color: var(--muted); background: rgba(255,255,255,.06); }
.tag-train { color: #ff8a4c; background: rgba(255,138,76,.13); }

/* ---------- home */
.statstrip { display: flex; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1.2rem; margin-bottom: 1.1rem; flex-wrap: wrap; row-gap: .6rem; }
.statstrip .st { padding: 0 1.4rem; border-left: 3px solid rgba(255,255,255,.18); }
.statstrip .st:first-child { border-left: 0; padding-left: .2rem; }
.statstrip .st b { display: block; font: 800 1.25rem/1.2 var(--display); }
.statstrip .st span { font-size: .78rem; color: var(--muted); font-weight: 600; }
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
.herotile {
  position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 20px; min-height: 300px;
  padding: 1.6rem; display: flex; flex-direction: column; justify-content: flex-end; color: #fff;
}
.herotile:hover { filter: brightness(1.07); background: none; }
.hero-play { background: linear-gradient(135deg, #2f6bff 0%, #17a2e8 55%, #1fd1c1 100%) !important; }
.hero-modes { background: linear-gradient(135deg, #7a2ff0 0%, #c4338f 60%, #ff5a5a 100%) !important; }
.herobig { font: 900 italic clamp(1.8rem, 3.6vw, 2.6rem)/1 var(--display); text-transform: uppercase; position: relative; z-index: 1; text-shadow: 0 4px 24px rgba(0,0,0,.25); }
.herosub { margin-top: .45rem; opacity: .9; font-weight: 600; position: relative; z-index: 1; }
.heroart { position: absolute; right: -30px; top: -20px; width: 300px; height: 300px; }
.widetile {
  width: 100%; margin-top: 1.1rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem;
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.3rem;
}
.wt-title { font: 900 italic 1.35rem/1 var(--display); text-transform: uppercase; }
.wt-sub { color: var(--muted); }
.wt-arrow { font-size: 1.8rem; color: var(--muted); }

/* ---------- spelkeuze */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .9rem; }
.mode { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.05rem 1.15rem; display: flex; flex-direction: column; gap: .55rem; min-height: 112px; }
button.mode:hover { border-color: rgba(47,107,255,.6); background: #1b2236; }
.mode.soon { opacity: .5; }
.mode-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.mode-top b { font-size: 1.08rem; }
.mode-desc { color: var(--muted); font-size: .9rem; }

/* ---------- lobby */
.lobby { padding-bottom: 7rem; }
.lobbyhead { display: flex; align-items: center; gap: 1rem; }
.lobbyhead .pagetitle { margin: .2rem 0 1rem; }
.backlink { border: 0; background: none; color: #c8d0e0; font-weight: 700; padding: .4em .5em; }
.backlink:hover { color: #fff; background: rgba(255,255,255,.05); }
.lobbygrid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.1rem; align-items: start; }
.lobbyside { display: grid; gap: 1.1rem; }
.names { list-style: none; padding: 0; margin: .3rem 0 .9rem; display: grid; gap: .55rem; }
.names li { display: flex; gap: .55rem; align-items: center; background: #141b2c; border: 1px solid var(--line); border-radius: 12px; padding: .45rem .5rem .45rem .6rem; }
.names .dot { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); }
.names input { flex: 1; background: transparent; border-color: transparent; font-weight: 700; }
.names input:focus { background: #12182a; }
.names select.ptype { width: auto; flex: none; max-width: 12rem; }
.names li.isbot input { color: #c9d4ff; }
.names button { padding: .45em .65em; background: transparent; border-color: transparent; color: var(--muted); }
.addrow { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.bigbtn { background: linear-gradient(180deg, #2f6bff, #1d4fd4); border: 0; color: #fff; font-weight: 700; padding: .8em 1em; border-radius: 12px; }
.bigbtn:hover { background: linear-gradient(180deg, #3d77ff, #2459dd); }
.extrarules { margin: .9rem 0 .4rem; background: #141b2c; border: 1px solid var(--line); border-radius: 12px; padding: .8rem .95rem; display: grid; gap: .6rem; }
.ertitle { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.switch { display: flex; align-items: center; gap: .75rem; cursor: pointer; }
.switch input { display: none; }
.switch .sl { width: 2.7rem; height: 1.55rem; border-radius: 99px; background: #39414c; position: relative; flex: none; transition: background .2s; }
.switch .sl::after { content: ""; position: absolute; left: .2rem; top: .2rem; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + .sl { background: var(--good); }
.switch input:checked + .sl::after { transform: translateX(1.15rem); }
.settings { margin-top: .9rem; color: var(--muted); }
.settings summary { cursor: pointer; font-weight: 600; }
.settings label { display: block; margin-top: .7rem; color: var(--text); font-size: .9rem; }
.settings label input, .settings label select { margin-top: .3rem; }
.startbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; gap: .3rem;
  padding: .9rem 1rem 1.1rem; background: linear-gradient(0deg, rgba(5,10,26,.98) 55%, rgba(5,10,26,0));
}
.startbtn {
  min-width: min(340px, 90vw); padding: .95em 2em; border: 0; border-radius: 14px; color: #fff; font-weight: 800; font-size: 1.1rem;
  background: linear-gradient(90deg, var(--hot1), var(--hot2)); box-shadow: 0 10px 30px rgba(232,51,111,.35);
}
.startbtn:hover { background: linear-gradient(90deg, #8a40ff, #f0447e); }

/* ---------- instellingen en opgeslagen spelers */
.settingsgrid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.1rem; align-items: start; }
.setcol { display: grid; gap: 1.1rem; }
.langpick { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: .2rem 0 .7rem; }
.langbtn { display: flex; align-items: center; gap: .65rem; justify-content: center; padding: .85em 1em; border-radius: 12px; font-weight: 800; font-size: 1rem; background: #141b2c; border: 1px solid var(--line); }
.langbtn .flag { font: 900 italic .8rem/1 var(--display); letter-spacing: .04em; padding: .35em .5em; border-radius: 6px; background: #232c44; color: var(--muted); }
.langbtn.active { border-color: transparent; background: linear-gradient(90deg, var(--hot1), var(--hot2)); color: #fff; box-shadow: 0 8px 24px rgba(232,51,111,.28); }
.langbtn.active .flag { background: rgba(255,255,255,.22); color: #fff; }
.setrows { display: grid; gap: .95rem; margin-top: .4rem; }
.setrange { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .35rem .8rem; font-size: .95rem; }
.setrange b { font: 800 .95rem/1 var(--display); color: var(--text); min-width: 3.2em; text-align: right; }
.setrange input[type=range] { grid-column: 1 / -1; padding: 0; accent-color: var(--hot2); }
.row.left { justify-content: flex-start; }
.muted { color: var(--muted); font-weight: 400; }
.regform { display: flex; gap: .6rem; }
.regform input { flex: 1; }
.regform .bigbtn { white-space: nowrap; }
.playerlist { display: grid; gap: .5rem; margin-top: .6rem; }
.preg { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; background: #141b2c; border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; }
.preg .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 1rem/1 var(--display); color: #0b0d10; }
.preg .pn { font-weight: 800; font-size: 1.05rem; }
.preg .ps { color: var(--muted); font-size: .85rem; }
.preg .pa { display: flex; gap: .4rem; }
.preg .pa button { padding: .4em .75em; font-size: .85rem; }
.preg .pa .danger { color: #ff9a92; border-color: rgba(240,82,82,.35); }
.savedchips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .1rem 0 .7rem; }
.savedchips:empty { display: none; }
.savedchips .lbl { width: 100%; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.chip { padding: .35em .8em; border-radius: 99px; font-weight: 700; font-size: .88rem; background: #18203a; border: 1px solid rgba(80,120,255,.35); }
.chip:hover { background: #22305a; }
.chip.used { opacity: .35; pointer-events: none; }
@media (max-width: 980px) { .settingsgrid { grid-template-columns: 1fr; } }

/* ---------- spel */
.game { display: grid; grid-template-columns: minmax(300px, var(--lcol, 35fr)) minmax(380px, var(--rcol, 65fr)); gap: 1.2rem; padding: 1rem 1.3rem; height: 100%; }
.left, .rightin { display: flex; flex-direction: column; min-height: 0; gap: .7rem; }
.left { min-width: 0; }
.right { container: rightcol / size; min-width: 0; }
.rightin { height: 100%; }
.game .left { font-size: calc(16px * var(--ui)); }
.gamehead { display: flex; align-items: center; gap: .6rem; font-size: 15px; }
.gametitle { font: 900 italic 1.2rem/1 var(--display); text-transform: uppercase; }
.roundpill { margin-left: auto; font-size: .8rem; font-weight: 700; color: #c8d0e0; background: var(--panel2); border-radius: 99px; padding: .3em .8em; }
.roundpill:empty { display: none; }
.banner {
  font: 900 italic 1.6em/1.08 var(--display); padding: .5em .75em; text-transform: none;
  background: var(--panel); border: 1px solid var(--line); border-left: .32em solid var(--accent); border-radius: var(--radius);
}
.phaseinfo { color: var(--muted); font-size: .72em; padding: 0 .2em; }
.phaseinfo .tg { display: block; margin-top: .3em; color: var(--warn); font-weight: 700; font-size: 1.15em; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(230px * var(--ui)), 1fr)); gap: .55em; }
.player {
  position: relative; border-radius: 18px; padding: .65em .8em .7em; background: var(--panel); border: 1px solid var(--line);
  transition: transform .2s, box-shadow .2s;
}
.player .name { font-weight: 800; font-size: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 2.6em; }
.player .num {
  position: absolute; top: .3em; right: .35em; font: 800 2em/1.35 var(--display); width: 1.55em; text-align: center; border-radius: .3em;
}
.player .pips { display: flex; gap: .35em; margin: .7em 3.9em .35em 0; }
.player .pip { flex: 1; height: .95em; border-radius: .3em; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.06); }
.player .meta { font-size: .82em; color: var(--muted); min-height: 1.2em; }
.player.current {
  background: linear-gradient(135deg, color-mix(in srgb, var(--pc) 70%, #1a0f3a), color-mix(in srgb, var(--pc) 35%, #120a2c));
  border-color: color-mix(in srgb, var(--pc) 70%, white); box-shadow: 0 14px 40px color-mix(in srgb, var(--pc) 35%, transparent);
  transform: scale(1.02);
}
.player.current .meta { color: rgba(255,255,255,.85); }
.player.current .pip { background: rgba(0,0,0,.28); }
.player.killer .meta { color: var(--warn); font-weight: 700; }
.player.current.killer .meta { color: #fff3c4; }
.player.out { opacity: .38; }
.player.out .name { text-decoration: line-through; }
.badge { display: inline-block; font: 800 .55em/1.5 "AfgInter", sans-serif; letter-spacing: .06em; padding: .1em .55em; border-radius: 6px; margin-left: .45em; vertical-align: middle; }
.badge.k { background: var(--warn); color: #2a1d00; }
.badge.o { background: var(--bad); color: #fff; }
.botbadge { font-size: .85em; color: #c9d4ff; margin-left: .3rem; font-weight: 600; }

.logwrap { display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; flex: 1; min-height: 80px; }
.loghead { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: .45rem .9rem; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.log { list-style: none; margin: 0; padding: .45rem .9rem; overflow: auto; flex: 1; }
.log li { padding: .16rem 0; border-bottom: 1px dashed rgba(255,255,255,.06); text-align: left; }
.logwrap.collapsed { flex: none; min-height: 0; }
.logwrap.collapsed .log { max-height: 3.5em; overflow: hidden; font-size: .85rem; padding-top: .3rem; padding-bottom: .3rem; }
.logwrap.collapsed .log li { border: 0; padding: .05rem 0; }
.log .good { color: var(--good); }
.log .warn { color: var(--warn); }
.log .hit { color: #ff9a7a; }
.log .out { color: var(--bad); font-weight: 700; }
.log .killer { color: var(--warn); font-weight: 700; }
.log .win { color: var(--warn); font-weight: 800; }
.log .muted { color: var(--muted); }
.log .turn { color: #7aa5ff; }
.log .start { color: var(--text); font-weight: 600; }

/* pijlenbalk */
.dartbar { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; align-self: center; width: min(560px, 100%); }
.turnbar { display: flex; flex: 1; align-items: stretch; }
.slot {
  flex: 1; display: flex; align-items: center; justify-content: center; min-height: 3.6rem; padding: .4rem .5rem;
  font: 800 1.45rem/1 var(--display); border-right: 1px solid var(--line); background: transparent; color: var(--text);
}
.slot.empty svg { width: 64px; height: 20px; opacity: .85; }
.slot.fixable { cursor: pointer; }
.slot.fixable:hover { background: rgba(47,107,255,.12); }
.slot.fixing { background: rgba(251,191,36,.14); color: var(--warn); box-shadow: inset 0 0 0 2px rgba(251,191,36,.6); }
.turnscore { min-width: 6.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .3rem .7rem; color: var(--muted); font-size: .72rem; text-align: center; }
.turnscore b { color: #fff; font: 800 1.8rem/1 var(--display); display: block; }
.turnscore .tm { margin-top: .25rem; font-weight: 700; padding: .1em .5em; border-radius: 6px; font-size: .74rem; }
.turnscore .tm.easy, .turnscore .tm.ok { color: var(--good); background: rgba(52,211,153,.12); }
.turnscore .tm.mid { color: var(--warn); background: rgba(251,191,36,.12); }
.turnscore .tm.hard { color: #ff7a6b; background: rgba(240,82,82,.13); }
.turnscore .tm.no { color: var(--muted); text-decoration: line-through; }

.boardwrap { flex: 1; min-height: 260px; display: flex; justify-content: center; align-items: center; }
#board { width: 100%; height: 100%; max-height: var(--boardh, 70vh); cursor: crosshair; user-select: none; touch-action: manipulation; }
#board.fixmode { cursor: copy; }
#board .boardedge { fill: #0d1017; stroke: #262c36; stroke-width: 1.5; }
#board .s-dark { fill: #17181c; }
#board .s-light { fill: #ecdfc5; }
#board .r-red { fill: #e2364a; }
#board .r-green { fill: #1f9a5a; }
#board .wire { fill: none; stroke: #b9c0c9; stroke-width: .5; opacity: .45; }
#board .lbl { font: 800 18px "AfgDisplay", "AfgInter", sans-serif; fill: #d9dde4; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#board .lbl.owned { fill: #fff; }
#board .ownring { stroke: #0d1017; stroke-width: 1; }
#board .hl { fill: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; }
#board .hl.on { opacity: .28; animation: pulse 1.4s ease-in-out infinite; }
#board .hl.dead { fill: #000; opacity: .55; animation: none; }
#board .dart { stroke: #000; stroke-width: 1.5; }
#board .statusring { fill: none; stroke-width: 7; stroke: #232a38; transition: stroke .3s; }
#board .statusring.green { stroke: var(--good); filter: drop-shadow(0 0 7px rgba(52,211,153,.75)); }
#board .statusring.yellow { stroke: #ffcc33; filter: drop-shadow(0 0 7px rgba(255,204,51,.65)); }
#board .statusring.red { stroke: var(--bad); filter: drop-shadow(0 0 9px rgba(240,82,82,.85)); animation: ringblink 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .1; } }
@keyframes ringblink { 50% { opacity: .35; } }

.statusrow { display: flex; justify-content: center; align-items: center; gap: .6rem; min-height: 2rem; }
.bstatus { font-weight: 700; padding: .32em 1em; border-radius: 99px; font-size: .95rem; background: var(--panel2); color: var(--muted); }
.bstatus:empty { display: none; }
.bstatus.green { background: rgba(52,211,153,.15); color: var(--good); }
.bstatus.yellow { background: rgba(255,204,51,.15); color: #ffcc33; }
.bstatus.red { background: rgba(240,82,82,.18); color: #ff9a92; }
button.small { padding: .3em .75em; font-size: .85rem; }
.controls { display: flex; gap: .55rem; justify-content: center; align-self: center; background: rgba(23, 46, 110, .55); border: 1px solid rgba(80,120,255,.25); border-radius: 16px; padding: .5rem; }
.ctrl { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); font-weight: 700; }
.ctrl.primary { min-width: 9.5rem; }
.notice { text-align: center; color: var(--warn); min-height: 1.4em; }

/* Brede bordkant: dartbord op volle hoogte, pijlen en knoppen in een smalle kolom ernaast */
@container rightcol (min-aspect-ratio: 1/1) {
  .rightin {
    display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 19cqw, 280px);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas: "board dart" "board ." "board status" "board controls" "board notice";
    gap: .7rem 1.1rem;
  }
  .rightin > .boardwrap { grid-area: board; min-height: 0; height: 100%; }
  .rightin > .dartbar { grid-area: dart; width: 100%; flex-direction: column; align-self: start; }
  .rightin .turnbar { flex-direction: column; }
  .rightin .slot { border-right: 0; border-bottom: 1px solid var(--line); min-height: 4.4rem; font-size: 1.7rem; }
  .rightin .turnscore { padding: .7rem; }
  .rightin > .statusrow { grid-area: status; flex-direction: column; align-items: stretch; text-align: center; }
  .rightin > .controls { grid-area: controls; flex-direction: column; align-self: stretch; }
  .rightin .ctrl { padding-top: .8rem; padding-bottom: .8rem; }
  .rightin .ctrl.primary { min-width: 0; }
  .rightin > .notice { grid-area: notice; font-size: .9rem; }
}
.fixhint { color: var(--warn); font-weight: 700; }

/* ---------- overlays */
.overlay { position: fixed; inset: 0; background: rgba(2,5,14,.72); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 10; padding: 1rem; }
.win { text-align: center; width: min(560px, 100%); }
.win h1, .win h2 { font: 900 italic 1.8rem/1.1 var(--display); text-transform: none; margin: .2rem 0 .6rem; }
.trophy { font-size: 4rem; }
.ranking { width: 100%; border-collapse: collapse; margin: 1rem 0; text-align: left; }
.ranking td { padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
.ranking td.r { text-align: right; color: var(--muted); }
.row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
.todayline { color: var(--muted); margin: -.3rem 0 .4rem; }
.todayline b { color: var(--text); }
.offline { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: .6rem 1rem; border-radius: 10px; z-index: 30; }
.appversion { position: fixed; left: .8rem; bottom: .45rem; font-size: .72rem; color: #4d5770; pointer-events: none; z-index: 9; letter-spacing: .03em; }
#confirm { z-index: 25; }

/* verdeel-popup */
.allocbox { width: min(540px, 100%); }
.allocbox h2 { margin: 0 0 .2rem; font: 900 italic 1.5rem/1.1 var(--display); }
.alloclist { display: grid; gap: .5rem; margin: 1rem 0; }
.arow { display: grid; grid-template-columns: 2.6rem 1fr auto; gap: .7rem; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: .55rem .75rem; }
.arow .anum { font: 800 1.1rem/1.8 var(--display); text-align: center; border-radius: 8px; color: #0b0d10; }
.arow .aname { font-weight: 700; }
.arow .apts { color: var(--muted); font-size: .85rem; }
.arow .apts.dead { color: var(--bad); font-weight: 700; }
.stepper { display: flex; align-items: center; gap: .4rem; }
.stepper button { width: 2.7rem; height: 2.7rem; padding: 0; font-size: 1.3rem; }
.stepper .val { min-width: 1.6rem; text-align: center; font: 800 1.35rem/1 var(--display); }
.remain { font-weight: 800; color: var(--warn); }
.remain.ok { color: var(--good); }

/* stem-instellingen */
.voicewrap { position: relative; }
.voicepanel {
  position: absolute; right: 0; top: calc(100% + .5rem); z-index: 30; width: 310px; text-align: left;
  background: #141a2a; border: 1px solid var(--line2); border-radius: var(--radius);
  padding: .95rem; box-shadow: 0 16px 50px rgba(0,0,0,.55);
}
.voicebox { display: grid; gap: .6rem; }
.voicebox label { display: grid; gap: .3rem; font-size: .9rem; }
.voicebox label.check { display: flex; gap: .5rem; align-items: center; }
.voicebox label.check input { width: auto; }
.voicebox input[type=range] { padding: 0; }
.voicebox .row { justify-content: flex-start; }
.voicebox .row button { padding: .45em .8em; font-size: .9rem; }
#voiceslot .voicebox { gap: .8rem; }
.vsub { display: grid; gap: .55rem; padding: .7rem .8rem; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.vsub.hidden { display: none; }
.voicebox input[type=password], .voicebox input[type=text], .voicebox input:not([type]) { font-family: inherit; }
.voicepanel { max-height: calc(100vh - 5rem); overflow: auto; width: 340px; }
.hint { margin: 0; color: var(--muted); font-size: .8rem; }

/* scorebord */
#stats { z-index: 20; align-items: stretch; }
.statsbox { width: min(1200px, 100%); display: flex; flex-direction: column; max-height: 100%; padding: 1.2rem 1.4rem; background: #121828; }
.statshead { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
.statshead .pagetitle { margin: 0; font-size: 2rem; }
.statshead select { width: auto; margin-left: auto; }
.tabs { display: flex; gap: .3rem; background: var(--panel2); padding: .25rem; border-radius: 12px; }
.tab { border: 0; background: transparent; padding: .45em .95em; color: var(--muted); font-weight: 600; }
.tab.active { background: var(--accent); color: #fff; }
.statsbody { overflow: auto; flex: 1; min-height: 200px; }
.statsfoot { display: flex; justify-content: space-between; align-items: center; margin-top: .8rem; }
.statsfoot .sub { margin: 0; }
.statsempty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
table.stats { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .95rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
table.stats th { position: sticky; top: 0; background: #1a2134; text-align: right; font-size: .75rem; color: var(--muted); font-weight: 700; padding: .65rem .6rem; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
table.stats th.l, table.stats td.l { text-align: left; }
table.stats th.sorted { color: var(--text); }
table.stats td { text-align: right; padding: .6rem; border-bottom: 1px solid rgba(255,255,255,.05); white-space: nowrap; font-variant-numeric: tabular-nums; }
table.stats tr:last-child td { border-bottom: 0; }
table.stats td.name { font-weight: 800; }
table.stats td.big { font: 800 1.1rem/1 var(--display); }
.medal { display: inline-block; width: 1.6em; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .85rem; }
.award { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.05rem; }
.award .ico { font-size: 2rem; line-height: 1; }
.award .ttl { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: .55rem; font-weight: 700; }
.award .who { font: 800 1.35rem/1.2 var(--display); margin-top: .15rem; }
.award .val { color: var(--warn); font-weight: 700; }
.award .desc { color: var(--muted); font-size: .82rem; margin-top: .3rem; }
.award.booby .val { color: var(--muted); }
table.h2h td, table.h2h th { text-align: center; }
table.h2h td.cnt { font: 800 1.1rem/1 var(--display); }
table.h2h td.zero { color: #3a4356; font-weight: 400; }
table.h2h td.self { background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.03) 6px 12px); }
.h2hnote { color: var(--muted); font-size: .85rem; margin: .7rem 0 0; }
.gamelist { display: grid; gap: .5rem; }
.gamerow { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .95rem; }
.gamerow summary { cursor: pointer; display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; list-style: none; }
.gamerow summary::-webkit-details-marker { display: none; }
.gamerow .when { color: var(--muted); font-size: .85rem; min-width: 7.5rem; }
.gamerow .gwin { font-weight: 800; }
.gamerow .rest { color: var(--muted); }
.gamerow table { margin-top: .6rem; }

/* ---------- animaties */
.fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 40; display: flex; justify-content: center; align-items: center; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
.fx { position: absolute; text-align: center; font-family: var(--display); font-weight: 900; font-style: italic; text-transform: uppercase; line-height: 1; }
.fx-flash { position: fixed; inset: 0; background: radial-gradient(circle, rgba(240,82,82,.55), rgba(240,82,82,0) 70%); animation: flash 1.1s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
.fx-out .who { font-size: clamp(3rem, 11vw, 9rem); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.8); animation: slam .5s cubic-bezier(.2,1.6,.4,1) both; }
.fx-out .stamp {
  display: inline-block; margin-top: .35em; font-size: clamp(2.4rem, 8vw, 6.5rem); color: var(--bad);
  border: .1em solid var(--bad); border-radius: .15em; padding: .05em .3em; transform: rotate(-8deg);
  background: rgba(10,14,24,.78); animation: stamp .35s .45s cubic-bezier(.2,1.8,.4,1) both;
}
.fx-out .dart { position: absolute; left: 50%; top: -6vh; font-size: 5rem; animation: dartin .45s cubic-bezier(.6,0,.9,.5) both; }
@keyframes slam { 0% { transform: scale(3) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes stamp { 0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
@keyframes dartin { 0% { transform: translate(60vw, -40vh) rotate(-35deg); } 100% { transform: translate(-50%, 0) rotate(-35deg); } }
.fx-pop { font-size: clamp(4rem, 14vw, 11rem); color: var(--warn); text-shadow: 0 0 40px rgba(251,191,36,.6), 0 8px 30px rgba(0,0,0,.8); animation: pop 1.6s cubic-bezier(.2,1.5,.4,1) both; }
.fx-pop.big { font-size: clamp(5rem, 19vw, 15rem); color: #ff5a3c; text-shadow: 0 0 60px rgba(255,90,60,.8), 0 8px 30px rgba(0,0,0,.8); }
.fx-pop small { display: block; font-size: .28em; color: #fff; letter-spacing: .1em; margin-top: .2em; font-style: normal; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 18% { transform: scale(1.12); opacity: 1; } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: scale(1.05) translateY(-4vh); opacity: 0; } }
.fx-toast { top: 14vh; font-size: clamp(1.4rem, 3.4vw, 2.6rem); padding: .4em 1em; border-radius: .5em; background: linear-gradient(90deg, #ffb648, #ff3d7f); color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: toast 1.9s ease both; }
@keyframes toast { 0% { transform: translateY(-30vh); } 15% { transform: translateY(0); } 85% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-4vh); opacity: 0; } }
.shake { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, 3px); } 80% { transform: translate(4px, -2px); } }
.player.ko { animation: ko .9s ease both; }
@keyframes ko { 0% { transform: scale(1.06); } 30% { transform: rotate(-3deg) scale(1.04); } 60% { transform: rotate(2deg); } 100% { transform: none; } }
.player.glow { animation: glow 1.4s ease 2; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px var(--warn), 0 0 40px var(--warn); } }
.win .trophy { animation: trophy 1.2s cubic-bezier(.2,1.6,.4,1) both, bob 2.4s 1.2s ease-in-out infinite; display: inline-block; }
@keyframes trophy { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .fx, .fx-flash, .shake, .player.ko, .player.glow { animation-duration: .01s !important; } }

/* ---------- kleinere schermen */
@media (max-width: 980px) {
  .topnav { grid-template-columns: auto 1fr; }
  .mainnav { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
  .navlink.active::after { bottom: -.3rem; }
  .lobbygrid, .hero { grid-template-columns: 1fr; }
  .game { grid-template-columns: 1fr; height: auto; }
  .right { container-type: normal; }
  .rightin { height: auto; }
  .logwrap { max-height: 200px; }
  #board { max-height: 62vh; }
}
@media (max-width: 560px) {
  .wordmark small, #src { display: none; }
  .addrow { grid-template-columns: 1fr; }
  .statstrip .st { padding: 0 .8rem; }
}

/* kop: logo | menu (gecentreerd in de vrije ruimte) | status. De status krijgt altijd zijn eigen
   breedte, zodat klok en statustekst nooit over het menu schuiven (ook niet ingezoomd). */
.topnav { grid-template-columns: auto minmax(0, 1fr) auto; }
.topnav .mainnav { justify-self: center; }
.topnav .status { min-width: 0; }
.topnav .status > * { flex: none; }
.topnav #src { flex: 0 1 auto; min-width: 2.5em; max-width: 26vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* te smal voor menu + status naast elkaar: menu op een eigen regel */
@media (max-width: 1240px) {
  .topnav { grid-template-columns: auto 1fr; }
  .topnav .mainnav { grid-column: 1 / -1; grid-row: 2; justify-content: center; justify-self: stretch; }
  .navlink.active::after { bottom: -.3rem; }
}

/* ---------- X01 en Count Up */
.tag-classic { color: #3ee08f; background: rgba(62,224,143,.12); border: 1px solid rgba(62,224,143,.3); }
.tag-practice { color: #ff8a4c; background: rgba(255,138,76,.13); }
.x01card { background: linear-gradient(160deg, rgba(36,72,60,.55), var(--panel) 55%); }
.cucard { background: linear-gradient(160deg, rgba(86,46,30,.55), var(--panel) 55%); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .7rem 0 .2rem; }
.chipx { font-size: .8rem; font-weight: 700; padding: .3em .75em; border-radius: 99px; background: rgba(255,255,255,.08); color: #d4dbe8; }
.xset { display: grid; gap: .75rem; margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.xrow { display: grid; grid-template-columns: minmax(7.5rem, auto) 1fr; align-items: center; gap: .8rem; }
.xrow.sub2 { background: rgba(0,0,0,.18); border-radius: 12px; padding: .45rem .6rem; }
.xl { font-weight: 700; font-size: .95rem; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #121a33; border: 1px solid var(--line); border-radius: 12px; padding: .25rem; gap: .25rem; }
.seg button { border: 0; background: transparent; color: #aab4c8; font-weight: 700; padding: .6em .4em; border-radius: 9px; }
.seg button:hover { color: #fff; background: rgba(255,255,255,.05); }
.seg button.on { color: #fff; background: linear-gradient(90deg, var(--hot1), var(--hot2)); box-shadow: 0 6px 18px rgba(232,51,111,.3); }
.xrow .stepper { justify-self: start; background: #121a33; border: 1px solid var(--line); border-radius: 12px; padding: .25rem; }
.xrow .stepper button { background: #22305a; border: 0; border-radius: 9px; width: 3.2rem; height: 2.4rem; }
.xrow .stepper .val { min-width: 4.2rem; }
.xrow .stepper.big .val { font-size: 1.5rem; min-width: 5.5rem; }
#x_help { margin: .1rem 0 0; }

.player.xp { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name name" "big side" "meta meta"; column-gap: .6em; align-items: center; }
.player.xp .name { grid-area: name; padding-right: 0; }
.player.xp .side { grid-area: side; display: flex; gap: .35em; align-items: flex-start; }
.player.xp .ls { display: grid; justify-items: center; background: rgba(0,0,0,.25); border-radius: .5em; padding: .25em .55em; min-width: 2.6em; }
.player.xp .ls small { font-size: .62em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.player.xp .ls b { font: 900 1.5em/1 var(--display); }
.player.xp.current .ls small { color: rgba(255,255,255,.8); }
.player.xp .bigscore { grid-area: big; font: 900 3.4em/1.05 var(--display); letter-spacing: -.02em; margin: .1em 0 .15em; font-variant-numeric: tabular-nums; }
.player.xp .meta { grid-area: meta; }
.players.solo { grid-template-columns: minmax(0, 1fr); }
.players.solo .player.xp .bigscore { font-size: 6em; }
.phaseinfo .tg.co { color: #3ee08f; font-size: 1.35em; }
.turnscore b.bustv { color: #ff6b5b; }
.fx-pop.bust { color: #ff5a4a; text-shadow: 0 0 40px rgba(255,90,74,.6), 0 8px 30px rgba(0,0,0,.8); }
.page.lobby { padding-bottom: 7.5rem; }

/* ---------- party/training */
.gencard { background: linear-gradient(160deg, rgba(60,44,96,.5), var(--panel) 55%); }
.player.xp .bigscore.small { font-size: 2.4em; }
.player.xp .bigscore.hearts { font-size: 2.2em; color: #ff5d7a; letter-spacing: .05em; }
.player.xp.current .bigscore.hearts { color: #ffd0da; }
.ctable { margin-top: .6em; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ctab { width: 100%; border-collapse: collapse; font-size: 1.05em; }
.ctab th { font: 900 1.1em/1 var(--display); padding: .55em .3em; color: #dbe2ef; background: #1a2134; }
.ctab th.closed { color: var(--muted); text-decoration: line-through; }
.ctab td { text-align: center; padding: .45em .3em; border-top: 1px solid var(--line); }
.ctab td.l, .ctab th.l { text-align: left; padding-left: .8em; font-weight: 800; white-space: nowrap; }
.ctab .dotc { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--pc); margin-right: .45em; }
.ctab td.mk { font-size: 1.35em; font-weight: 900; color: #e9eef7; }
.ctab td.m3 { color: #3ee08f; }
.ctab td.closed { opacity: .45; }
.ctab td.pts { font: 900 1.3em/1 var(--display); }
.ctab tr.cur td { background: rgba(47,107,255,.14); }

/* ---------- prestatiemodus (Raspberry Pi): zelfde uiterlijk, zonder dure live-filters */
html.perf .bgfx::after { filter: none; background: radial-gradient(closest-side, rgba(255,61,127,.13), rgba(47,107,255,.05) 60%, transparent); height: 16vw; }
html.perf .topnav { backdrop-filter: none; background: rgba(8, 12, 24, .97); }
html.perf .overlay { backdrop-filter: none; background: rgba(2, 5, 14, .86); }
html.perf #board .statusring.green, html.perf #board .statusring.yellow, html.perf #board .statusring.red { filter: none; stroke-width: 9; }
html.perf #board .statusring.red { animation: none; }
html.perf .player { transition: none; }
html.perf .herotile:hover { filter: none; }
/* geen grote zachte schaduwen (duur om te tekenen zonder krachtige GPU) en geen eindeloze animaties */
html.perf .card, html.perf .startbtn, html.perf .langbtn.active, html.perf .seg button.on, html.perf .pt-mark,
html.perf .voicepanel, html.perf .fx-toast { box-shadow: none; }

html.perf #board .hl.on { animation: none; opacity: .3; }
html.perf #board .hl { transition: none; }
html.perf #board .statusring { transition: none; }
html.perf .win .trophy { animation: trophy 1.2s cubic-bezier(.2,1.6,.4,1) both; }
html.perf .bgfx::after { display: none; }
html.perf button { transition: none; }

/* ---------- telefoon koppelen */

.qrbox h2 { margin: 0; font: 900 italic 1.5rem/1 var(--display); text-transform: uppercase; }
.qrbox img { width: 260px; height: 260px; border-radius: 12px; background: #fff; padding: 6px; }
.qrurl { font: 800 1.05rem/1.2 var(--display); color: var(--warn); word-break: break-all; }
.qrsteps { text-align: left; margin: .2rem 0 0; padding-left: 1.3rem; color: #d6dce8; display: grid; gap: .3rem; }
.qrx { position: absolute; top: .7rem; right: .7rem; }

/* ---------- telefoon als afstandsbediening (/?remote=1) */

.remotebtn {
  display: inline-flex; align-items: center; gap: .35em; padding: .45em .8em; border-radius: 12px; font-weight: 800;
  color: #fff; text-decoration: none; background: linear-gradient(90deg, var(--hot1), var(--hot2));
}

@media (max-width: 560px) {
  html.remote .topnav { padding: .45rem .6rem; gap: .4rem; }
  html.remote .status { gap: .35rem; }
  html.remote #src { display: none; }

/* ---------- pictogrammen (SVG: werken ook zonder emoji-lettertype, zoals op Raspberry Pi OS Lite) */
.iconbtn .ico { width: 1.25em; height: 1.25em; display: block; }
#sound .ico-off { display: none; }
#sound.muted .ico-on { display: none; }
#sound.muted .ico-off { display: inline; }
#sound.muted { color: var(--muted); }
.powerbtn:hover { color: #ff9a92; border-color: rgba(240,82,82,.6); }
.powerbox { max-width: 520px; }
.powerbox .row { justify-content: center; flex-wrap: wrap; }
button.danger.primary { background: linear-gradient(180deg, #f05252, #c81e1e); }

/* ---------- updates */
.upblock { display: grid; gap: .5rem; padding: .8rem .9rem; margin: .6rem 0; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.upblock h3 { margin: 0; font-size: 1rem; }
.uprow { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.uprow input[type=file] { flex: 1; min-width: 12rem; font: inherit; color: var(--muted); }
.setrange2 { display: grid; gap: .3rem; font-size: .92rem; }
.upnotes { white-space: pre-wrap; max-height: 9rem; overflow: auto; }

/* ---------- spelerspagina */
.plgrid { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; gap: 1.1rem; align-items: start; }
.pllist { display: grid; gap: .6rem; position: sticky; top: 4.5rem; max-height: calc(100vh - 6rem); overflow: auto; }
.pllist input, .pllist select { width: 100%; }
.plitems { display: grid; gap: .35rem; }
.plitem { display: grid; grid-template-columns: auto 1fr; gap: .65rem; align-items: center; text-align: left; padding: .5rem .6rem; background: transparent; border-color: transparent; }
.plitem:hover { background: var(--panel2); }
.plitem.on { background: rgba(47,107,255,.16); border-color: rgba(80,120,255,.45); }
.plitem .plin { display: grid; min-width: 0; }
.plitem b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plitem small { color: var(--muted); font-size: .8rem; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 1rem/1 var(--display); color: #0b0d10; flex: none; }
.av.big { width: 58px; height: 58px; font-size: 1.5rem; }
.plmain { display: grid; gap: 1rem; min-width: 0; }
.plhead { display: grid; gap: .7rem; }
.plwho { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }
.plwho h2 { margin: 0; font: 900 italic 1.8rem/1.1 var(--display); }
.plwho #plmail { margin-left: auto; }
.seg.plrange { display: flex; flex-wrap: wrap; width: auto; max-width: 100%; }
.seg.plrange button { flex: 0 1 auto; }
.pldates { display: flex; gap: .5rem; align-items: center; color: var(--muted); flex-wrap: wrap; }
.pldates input { width: auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .7rem; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem 1rem; display: grid; gap: .15rem; }
.kpi b { font: 900 1.7rem/1.1 var(--display); }
.kpi span { color: var(--muted); font-size: .85rem; }
.plcols { display: grid; grid-template-columns: 1fr; gap: 1rem; }
.plcols h3, .plmain .card h3 { margin: 0 0 .6rem; font-size: 1.05rem; }
.plmodes small, .pgkey small { color: var(--muted); font-size: .75em; margin-right: .2em; }
.plchart { width: 100%; height: 170px; }
.plchart .cg { fill: rgba(120,150,255,.35); }
.plchart .cw { fill: #3ecf8e; }
.plchart .cl { fill: #8b93a7; font-size: 10px; text-anchor: middle; }
.plleg { display: flex; gap: .4rem; align-items: center; color: var(--muted); font-size: .85rem; margin-top: .3rem; }
.plleg .lg, .plleg .lw { width: .8rem; height: .8rem; border-radius: 3px; display: inline-block; margin-left: .6rem; }
.plleg .lg { background: rgba(120,150,255,.5); } .plleg .lw { background: #3ecf8e; }
.listtools { display: flex; gap: .5rem; align-items: center; justify-content: flex-end; margin-bottom: .5rem; color: var(--muted); font-size: .9rem; }
.listtools select { width: auto; }
.plgames { display: grid; gap: .35rem; }
.plgame { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; }
.plgame summary { display: grid; grid-template-columns: 2.4rem 7rem 8rem 9rem 1fr; gap: .6rem; align-items: center; padding: .55rem .8rem; cursor: pointer; list-style: none; }
.plgame summary::-webkit-details-marker { display: none; }
.plgame[open] { padding-bottom: .5rem; }
.plgame table { margin: 0 .6rem; width: calc(100% - 1.2rem); }
.pgplace { font-size: 1.2rem; text-align: center; } .pgwhen { color: var(--muted); } .pgmode { font-weight: 700; }
.pgvs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.stats tr.me td { background: rgba(62,207,142,.12); font-weight: 700; }
.preg { grid-template-columns: auto 1fr auto; }
.preg .pmail { grid-column: 2 / -1; grid-row: 2; font-size: .85rem; padding: .4em .6em; }
.pill.ok { color: var(--good); border-color: rgba(52,211,153,.4); }
.mlrow { display: grid; grid-template-columns: 1fr 6rem; gap: .6rem; }
.mlrow.hidden { display: none; }
#mailcard { display: grid; gap: .6rem; }
#mailcard.hidden { display: none; }
@media (max-width: 980px) {
  .plgrid, .plcols { grid-template-columns: 1fr; }
  .pllist { position: static; max-height: none; }
  .plitems { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .plgame summary { grid-template-columns: 2rem 1fr 1fr; }
  .plgame .pgkey, .plgame .pgvs { grid-column: 2 / -1; }
  .preg { grid-template-columns: auto 1fr; }
  .preg .pmail, .preg .pa { grid-column: 1 / -1; grid-row: auto; }
}
.plgrid > *, .plmain > * { min-width: 0; }
.plmain .card { overflow-x: auto; }

/* klok in de bovenbalk */
.clock { font: 700 .85rem/1 var(--display, inherit); color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; padding: 0 .2rem; white-space: nowrap; }
/* vrij gooien: stoppen en opslaan */
.ctrl.finish { background: linear-gradient(135deg, rgba(62,224,143,.22), rgba(62,224,143,.08)); border-color: rgba(62,224,143,.45); }
/* shoot-out keuze */
.sobox { text-align: center; }
.sobtns { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1rem 0 .6rem; }
.sobtn { display: flex; flex-direction: column; gap: .35rem; align-items: center; justify-content: center; padding: 1.3rem .8rem; border-radius: 16px;
  background: var(--panel2); border: 2px solid var(--line2); color: var(--text); cursor: pointer; font-size: 1.05rem; }
.sobtn:hover, .sobtn:focus-visible { border-color: var(--accent); }
.sobtn small { color: var(--muted); font-size: .8rem; }
.player.xp.soout { opacity: .45; }

      this.log = [];
      this.announce = [];
      this.fx = [];
      this.notice = null;
      this._replaying = false;
      this.order = [];
      this.turn_pos = 0;
      this.turn_darts = [];
      this.turn_dart_events = [];
      this.turn_score = 0;
      this.turn_no = 0;
      this.winner = null;
      this._cur_event = 0;
      this.resetMode();
    }
    defaultSettings() { return {}; }
    cleanSettings() { return { ...this.defaultSettings() }; }
    resetMode() {}

    newGame(names, settings, bots) {
      const [clean, levels] = cleanNames(names, bots, this.MIN_PLAYERS);
      const data = { names: clean, settings: this.cleanSettings(settings) };
      if (levels.some((l) => l)) data.bots = levels;
      this.events = [["start", data]];
      this._rebuild(true);
      this.version += 1;
    }
    throw_(dart) { if (!(dart instanceof Dart)) dart = Dart.fromDict(dart); return this._record(["dart", dart.toDict()]); }
    nextPlayer() { return this._record(["next", null]); }
    takeout() { return this._record(["takeout", null]); }
    allocate() { this.announce = []; this.fx = []; this.notice = ["n_no_pending", {}]; return false; }
    choose(choice) {
      if (!["setup", "finished", "shootout"].includes(this.phase)) {
        this.announce = []; this.fx = [];
        return this._ignore("n_no_choice");
      }
      return this._record(["choose", pyStr(choice)]);
    }
    correct(index, dart) {
      this.announce = []; this.fx = []; this.notice = null;
      if (this.phase === "setup") { this.notice = ["n_no_correct", {}]; return false; }
      if (!(dart instanceof Dart)) dart = Dart.fromDict(dart);
      const lst = this.turn_dart_events;
      let i;
      try { i = pyInt(index, "x"); } catch (e) { i = -1; }
      if (!(i >= 0 && i < lst.length)) { this.notice = ["n_no_dart", {}]; return false; }
      const evI = lst[i];
      const old = this.events[evI];
      this.events[evI] = ["dart", dart.toDict()];
      try { this._rebuild(); } catch (e) {
        this.events[evI] = old;
        this._rebuild();
        throw new GameError("err_correct_conflict");
      }
      this.notice = ["n_corrected", { i: i + 1, label: dart.label }];
      this.version += 1;
      return true;
    }
    undo() {
      this.announce = []; this.fx = []; this.notice = null;
      if (this.events.length <= 1) { this.notice = ["n_nothing_undo", {}]; return false; }
      this.events.pop();
      this._rebuild();
      this.notice = ["n_undone", {}];
      this.version += 1;
      return true;
    }
    reset() { this.events = []; this._rebuild(); this.version += 1; }
    loadEvents(events) {
      this.events = events.map((e) => [e[0], e[1]]);
      try { this._rebuild(); } catch (e) { this.events = []; this._rebuild(); }
      this.version += 1;
    }
    get current() {
      if ((this.phase === "bulloff" || this.phase === "play") && this.order.length) return this.order[this.turn_pos];
      return null;
    }
    _record(ev) {
      this.announce = []; this.fx = []; this.notice = null;
      if (this.phase === "setup" || this.phase === "finished") {
        this.notice = [this.phase === "setup" ? "n_start_first" : "n_finished", {}];
        return false;
      }
      this._cur_event = this.events.length;
      const ok = this._apply(ev);
      if (ok) { this.events.push(ev); this.version += 1; }
      return ok;
    }
    _rebuild(live = false) {
      const events = this.events.slice();
      this._reset();
      this._replaying = !live;
      events.forEach((ev, i) => { this._cur_event = i; this._apply(ev); });
      this._replaying = false;
      this.events = events;
    }
    _say(kind, key, speak, p) {
      p = p || {};
      this.log.push({ k: key, p, kind });
      if (this.log.length > 300) this.log = this.log.slice(-300);
      if (speak && !this._replaying) this.announce.push([speak, p]);
    }
    _speak(key, p) { if (!this._replaying) this.announce.push([key, p || {}]); }
    _effect(type, data) { if (!this._replaying) this.fx.push({ type, ...data }); }
    _ignore(key, p) { this.notice = [key, p || {}]; return false; }
    _newPlayer(name, i, bot) {
      return { name, index: i, color: i, bot, place: null, darts: 0, points: 0, n180: 0, n140: 0, n100: 0, hi_turn: 0 };
    }
    _apply([kind, data]) {
      if (kind === "start") {
        this.settings = this.cleanSettings(data.settings);
        const bots = data.bots || [];
        this.players = data.names.map((n, i) => this._newPlayer(n, i, i < bots.length ? pyInt(bots[i], "x") : 0));
        this.start();
        return true;
      }
      return this.play(kind, data);
    }
    _turnStats(p, pts) {
      if (pts === 180) p.n180 += 1;
      else if (pts >= 140) p.n140 += 1;
      else if (pts >= 100) p.n100 += 1;
      p.hi_turn = Math.max(p.hi_turn, pts);
    }
    _callScore(pts) {
      if (pts === 180) { this._speak("s_180"); this._effect("ton", { score: 180, player: this.current, pts: 0 }); }
      else if (pts === 0) this._speak("g_s_noscore");
      else {
        this._speak("s_score", { score: pts });
        if (pts >= 100) this._effect("ton", { score: pts, player: this.current, pts: 0 });
      }
    }
    _baseState(lang) {
      lang = lang === "en" || lang === "nl" ? lang : "nl";
      return {
        mode: this.MODE,
        version: this.version,
        phase: this.phase,
        settings: { ...this.settings },
        players: this.players.map((p) => JSON.parse(JSON.stringify(p))),
        current: this.current,
        order: this.order.slice(),
        turn_no: this.turn_no,
        darts: this.turn_darts.map((d) => { const o = d.toDict(); o.label = labelText(lang, d.label); return o; }),
        turn_score: this.phase === "play" ? this.turn_score : 0,
        pending: null,
        queued: 0,
        sel_step: null,
        winner: this.winner,
        log: this.log.slice(-60).map((e) => ({ text: tr(lang, e.k, e.p), kind: e.kind })),
        announce: this.announce.map(([k, p]) => tr(lang, k, p)),
        fx: this.fx.map((f) => ({ ...f })),
        notice: this.notice ? tr(lang, this.notice[0], this.notice[1]) : null,
        can_undo: this.events.length > 1,
        lang,
      };
    }
  }

  function dist(d) {
    if (d.x !== null) return { label: d.label, mm: fmt0(d.bullDistance() * 170.0) };
    return { label: d.label, mm: null };
  }

  // =================================================================== X01
  class X01Game extends BaseGame {
    get MODE() { return "x01"; }
    defaultSettings() {
      return { start: 501, match: "legs", legs: 1, sets: 1, in_mode: "straight", out_mode: "double", bulloff: "off", shootout: "off" };
    }
    cleanSettings(d) {
      d = d || {};
      const s = this.defaultSettings();
      s.start = intOf(d, "start", s.start);
      s.legs = intOf(d, "legs", s.legs);
      s.sets = intOf(d, "sets", s.sets);
      for (const [k, opts] of [["match", ["off", "legs", "sets"]], ["in_mode", ["straight", "double", "master"]],
        ["out_mode", ["straight", "double", "master"]], ["bulloff", ["off", "wdf", "pdc"]],
        ["shootout", ["off", "on"]]]) {
        s[k] = pyStr(has(d, k) ? d[k] : s[k]);
        if (!opts.includes(s[k])) throw new GameError("err_settings");
      }
      if (!X01_SCORES.includes(s.start) || !(s.legs >= 1 && s.legs <= 11) || !(s.sets >= 1 && s.sets <= 7)) throw new GameError("err_settings");
      if (s.match === "off") { s.legs = 1; s.sets = 1; } else if (s.match === "legs") s.sets = 1;
      return s;
    }
    resetMode() {
      this.leg_no = 0; this.set_no = 1; this.bust = false; this.leg_done = null;
      this.turn_start = 0; this.turn_opened = false; this.bo_queue = []; this.bo_darts = new Map(); this.tiebreak = 0;
      this.turn_on_finish = false;
      this.so_choice = null; this.so_chooser = null; this.so_rest = []; this.so_queue = []; this.so_vals = new Map();
      this.so_next_place = 0; this.so_round = 0;
    }
    _newPlayer(name, i, bot) {
      return Object.assign(super._newPlayer(name, i, bot), {
        score: 0, legs: 0, sets: 0, legs_total: 0, opened: false, darts_leg: 0, f9_points: 0, f9_darts: 0,
        hi_checkout: 0, best_leg: null, co_att: 0, co_hit: 0, busts: 0, avg_points: 0, avg_darts: 0,
      });
    }
    start() {
      const s = this.settings;
      this._say("start", "xo_l_new", null, { start: s.start, names: this.players.map((p) => p.name) });
      if (s.bulloff !== "off" && this.players.length > 1) {
        this.phase = "bulloff";
        this.order = this.players.map((_, i) => i);
        this.bo_queue = this.order.slice();
        this.turn_pos = 0;
        this._say("turn", "xo_l_bulloff", "xo_s_bulloff", { name: this.players[0].name });
        return;
      }
      this.order = this.players.map((_, i) => i);
      this._startLeg();
    }
    _legOrderStart() { return this.leg_no % this.order.length; }
    _startLeg() {
      this.phase = "play";
      for (const p of this.players) { p.score = this.settings.start; p.opened = this.settings.in_mode === "straight"; p.darts_leg = 0; }
      this.turn_pos = this._legOrderStart();
      this.turn_no = 1;
      this.leg_done = null;
      this._beginTurn(true);
    }
    _beginTurn(first = false) {
      const p = this.players[this.order[this.turn_pos]];
      this.turn_darts = []; this.turn_dart_events = [];
      this.turn_score = 0;
      this.bust = false;
      this.turn_start = p.score;
      this.turn_opened = p.opened;
      this.turn_on_finish = !!(p.opened && checkout(p.score, DARTS, this.settings.out_mode));
      if (first) {
        if (this.settings.match === "sets") this._say("start", "xo_l_leg_set", null, { set: this.set_no, leg: this._legInSet(), name: p.name });
        else this._say("start", "xo_l_leg", null, { leg: this.leg_no + 1, name: p.name });
        this._say("turn", "xo_l_turn", this.leg_no === 0 ? "xo_s_gameon" : "xo_s_leg_start", { name: p.name, score: p.score });
        return;
      }
      const route = p.opened ? checkout(p.score, DARTS, this.settings.out_mode) : null;
      this._say("turn", "xo_l_turn", route ? "xo_s_require" : "s_name", { name: p.name, score: p.score });
    }
    _legInSet() { return this.players.reduce((a, p) => a + p.legs, 0) + 1; }
    get current() {
      if (this.phase === "shootout") return this.so_queue.length ? this.so_queue[0] : this.so_chooser;
      return super.current;
    }
    play(kind, data) {
      if (this.phase === "bulloff") return this._playBulloff(kind, data);
      if (this.phase === "shootout") return this._playShootout(kind, data);
      if (kind === "choose") return this._ignore("n_no_choice");
      const p = this.players[this.order[this.turn_pos]];
      const waiting = this.leg_done !== null || this.bust || this.turn_darts.length >= DARTS;
      if (kind === "dart") {
        if (waiting) return this._ignore("n_turn_full", { name: p.name, n: DARTS });
        this._dart(p, Dart.fromDict(data));
        return true;
      }
      if (kind === "next" || kind === "takeout") {
        if (kind === "takeout" && !this.turn_darts.length && this.leg_done === null) return true;
        this._endTurn(p);
        return true;
      }
      return false;
    }
    _inOk(d) {
      const m = this.settings.in_mode;
      if (m === "double") return d.multiplier === 2;
      if (m === "master") return d.multiplier === 2 || d.multiplier === 3;
      return !d.isMiss;
    }
    _dart(p, d) {
      this.turn_darts.push(d);
      this.turn_dart_events.push(this._cur_event);
      p.darts += 1;
      p.darts_leg += 1;
      const out = this.settings.out_mode;
      if (p.opened && oneDartFinish(p.score, out)) p.co_att += 1;
      let sc = d.score;
      let logged = false;
      if (!p.opened) {
        logged = true;
        if (this._inOk(d)) { p.opened = true; this._say("good", "xo_l_opened", null, { name: p.name, label: d.label, score: p.score - sc }); }
        else { this._say("muted", "xo_l_notopen", null, { name: p.name, label: d.label }); sc = 0; }
      }
      const nw = p.score - sc;
      const kind = d.multiplier === 2 && d.number !== 25 ? "D" : d.number === 25 && d.multiplier === 2 ? "E"
        : d.multiplier === 3 ? "T" : d.number === 25 ? "B" : "S";
      const bust = nw < 0 || (nw === 1 && out !== "straight") || (nw === 0 && !finishOk(kind, out));
      if (bust) {
        this.bust = true;
        p.score = this.turn_start;
        p.opened = this.turn_opened;
        p.busts += 1;
        this._say("hit", "xo_l_bust", "xo_s_bust", { name: p.name, label: d.label, score: p.score });
        this._effect("bust", { player: this.order[this.turn_pos] });
        this._turnPoints(p, 0);
        this.turn_score = 0;
        return;
      }
      p.score = nw;
      this.turn_score += sc;
      if (nw === 0) { this._legWon(p, d); return; }
      if (!logged) this._say("info", "xo_l_dart", null, { name: p.name, label: d.label, score: nw });
      if (this.turn_darts.length >= DARTS) { this._turnPoints(p, this.turn_score); this._callScore(this.turn_score); }
    }
    _turnPoints(p, pts) {
      p.points += pts;
      if (!this.turn_on_finish) { p.avg_points += pts; p.avg_darts += this.turn_darts.length; }
      const before = p.darts_leg - this.turn_darts.length;
      if (before < 9) { p.f9_points += pts; p.f9_darts += Math.min(this.turn_darts.length, 9 - before); }
      this._turnStats(p, pts);
    }
    _legWon(p, d) {
      const idx = this.order[this.turn_pos];
      const co = this.turn_score;
      this._turnPoints(p, co);
      p.co_hit += 1;
      p.hi_checkout = Math.max(p.hi_checkout, co);
      if (p.best_leg === null || p.darts_leg < p.best_leg) p.best_leg = p.darts_leg;
      p.legs += 1;
      p.legs_total += 1;
      const s = this.settings;
      let setWon = false;
      if (s.match === "sets" && p.legs >= s.legs) { p.sets += 1; setWon = true; }
      const matchWon = s.match === "sets" ? p.sets >= s.sets : p.legs >= s.legs;
      this._say("win", "xo_l_checkout", null, { name: p.name, label: d.label, score: co, darts: p.darts_leg });
      if (matchWon) {
        this.winner = idx;
        if (s.shootout === "on" && this.players.length >= 3) {
          p.place = 1;
          this._say("win", "xo_l_match", "s_win", { name: p.name });
          this._effect("win", { player: idx });
          this._startShootout();
          return;
        }
        this.phase = "finished";
        this._place();
        this._say("win", "xo_l_match", "s_win", { name: p.name });
        this._effect("win", { player: idx });
        return;
      }
      this.leg_done = idx;
      if (setWon) this._say("win", "xo_l_set", "xo_s_set", { name: p.name, set: this.set_no });
      else this._speak("xo_s_leg", { name: p.name });
      this._effect("leg", { player: idx, score: co });
    }
    _endTurn(p) {
      if (this.leg_done !== null) {
        if (this.settings.match === "sets" && this.players[this.leg_done].legs >= this.settings.legs) {
          for (const q of this.players) q.legs = 0;
          this.set_no += 1;
        }
        this.leg_no += 1;
        this._startLeg();
        return;
      }
      if (!this.bust && this.turn_darts.length < DARTS) {
        const missing = DARTS - this.turn_darts.length;
        p.darts += missing;
        p.darts_leg += missing;
        this._turnPointsPartial(p);
      }
      const n = this.order.length;
      this.turn_pos = (this.turn_pos + 1) % n;
      if (this.turn_pos === this._legOrderStart()) this.turn_no += 1;
      this._beginTurn();
    }
    _turnPointsPartial(p) {
      const pts = this.turn_score;
      p.points += pts;
      if (!this.turn_on_finish) { p.avg_points += pts; p.avg_darts += DARTS; }
      const before = p.darts_leg - DARTS;
      if (before < 9) { p.f9_points += pts; p.f9_darts += Math.min(DARTS, 9 - before); }
      this._turnStats(p, pts);
      this._callScore(pts);
    }
    _place() {
      const w = this.winner, P = this.players;
      const rest = P.map((_, i) => i).filter((i) => i !== w).sort((a, b) =>
        (P[b].sets - P[a].sets) || (P[b].legs_total - P[a].legs_total) || (P[a].score - P[b].score) || (a - b));
      P[w].place = 1;
      rest.forEach((i, k) => { P[i].place = k + 2; });
    }
    _playBulloff(kind, data) {
      const cur = this.order[this.turn_pos];
      const p = this.players[cur];
      if (kind === "choose") return this._ignore("n_no_choice");
      if (kind === "dart") {
        if (this.bo_darts.has(cur)) return this._ignore("n_sel_done", { name: p.name });
        const d = Dart.fromDict(data);
        this.turn_darts = [d];
        this.turn_dart_events = [this._cur_event];
        const pdc = this.settings.bulloff === "pdc";
        const val = pdc ? (d.number === 25 && d.multiplier === 2 ? 0 : d.number === 25 ? 1 : 9) : d.bullDistance();
        this.bo_darts.set(cur, val);
        if (pdc) this._say("info", "xo_l_bo_pdc", null, { name: p.name, label: d.label });
        else this._say("info", "l_sel_bull", null, { name: p.name, dist: dist(d) });
        return true;
      }
      if (kind === "next" || kind === "takeout") {
        if (!this.bo_darts.has(cur)) {
          if (kind === "takeout") { this.turn_darts = []; this.turn_dart_events = []; return true; }
          return this._ignore("n_sel_wait_bull", { name: p.name });
        }
        this.bo_queue.shift();
        this.turn_darts = []; this.turn_dart_events = [];
        if (this.bo_queue.length) {
          this.turn_pos = this.order.indexOf(this.bo_queue[0]);
          this._say("turn", "xo_l_bulloff", "xo_s_bulloff", { name: this.players[this.bo_queue[0]].name });
          return true;
        }
        this._resolveBulloff();
        return true;
      }
      return false;
    }
    _resolveBulloff() {
      const keys = [...this.bo_darts.keys()].sort((a, b) => a - b);
      const best = Math.min(...keys.map((k) => this.bo_darts.get(k)));
      const top = keys.filter((k) => this.bo_darts.get(k) === best);
      if (top.length > 1 || best === 9) {
        this.tiebreak += 1;
        this.bo_darts = new Map();
        this.bo_queue = best !== 9 ? top : keys;
        this.turn_pos = this.order.indexOf(this.bo_queue[0]);
        this._say("warn", "l_tie", "s_tie", { names: this.bo_queue.map((i) => this.players[i].name) });
        return;
      }
      const w = top[0], n = this.players.length;
      this.order = Array.from({ length: n }, (_, k) => (w + k) % n);
      this._say("start", "l_order", null, { order: this.order.map((i) => this.players[i].name) });
      this._startLeg();
    }
    // ------------------------------------------------------- shoot-out
    _startShootout() {
      const P = this.players;
      const rest = P.map((_, i) => i).filter((i) => i !== this.winner).sort((a, b) =>
        (P[b].sets - P[a].sets) || (P[b].legs_total - P[a].legs_total) || (P[a].score - P[b].score) || (a - b));
      this.phase = "shootout";
      this.so_rest = rest;
      this.so_chooser = rest[0];
      this.so_choice = null;
      this.so_queue = [];
      this.so_vals = new Map();
      this.so_next_place = P.length;
      this.so_round = 0;
      this.turn_darts = []; this.turn_dart_events = [];
      this.turn_score = 0;
      this.bust = false;
      this.leg_done = null;
      this._say("turn", "xo_l_so_start", "xo_s_so_choose", { name: P[rest[0]].name });
    }
    _soNeed() { return this.so_choice === "bull" ? 1 : DARTS; }
    _soNewRound(who) {
      this.so_round += 1;
      let order = this.order.filter((i) => who.includes(i));
      const k = order.indexOf(this.so_chooser);
      if (k >= 0) order = order.slice(k).concat(order.slice(0, k));
      this.so_queue = order;
      this.so_vals = new Map();
      this.turn_darts = []; this.turn_dart_events = [];
      this.turn_score = 0;
      this._say("turn", "xo_l_so_turn", "s_name", { name: this.players[order[0]].name });
    }
    _playShootout(kind, data) {
      const P = this.players;
      if (kind === "choose") {
        if (this.so_choice !== null || (data !== "bull" && data !== "score")) return this._ignore("n_no_choice");
        this.so_choice = data;
        this._say("start", data === "bull" ? "xo_l_so_bull" : "xo_l_so_score_pick", null, { name: P[this.so_chooser].name });
        this._soNewRound(this.so_rest);
        return true;
      }
      if (this.so_choice === null) {
        if (kind === "takeout") return false;
        return this._ignore("n_so_choose", { name: P[this.so_chooser].name });
      }
      const cur = this.so_queue[0];
      const p = P[cur];
      const bull = this.so_choice === "bull";
      if (kind === "dart") {
        if (this.turn_darts.length >= this._soNeed()) return this._ignore("n_turn_full", { name: p.name, n: this._soNeed() });
        const d = Dart.fromDict(data);
        this.turn_darts.push(d);
        this.turn_dart_events.push(this._cur_event);
        if (bull) {
          this.so_vals.set(cur, d.bullDistance());
          this._say("info", "l_sel_bull", null, { name: p.name, dist: dist(d) });
        } else {
          this.turn_score += d.score;
          this.so_vals.set(cur, -this.turn_score);

    _active(i) { const q = this.players[i]; return !q.out && !q.done; }
    _advance() {
      const n = this.order.length;
      let pos = this.turn_pos;
      for (;;) {
        pos += 1;
        if (pos >= n) {
          pos = 0;
          if (this._endOfRound()) return;
        }
        if (this._active(this.order[pos])) break;
      }
      this.turn_pos = pos;
      this._beginTurn();
    }
    _endOfRound() {
      if (!this.order.some((i) => this._active(i))) { this._finish(); return true; }
      const r = this.roundsTotal();
      if (r !== null && this.turn_no >= r) { this._finish(); return true; }
      this.turn_no += 1;
      this.roundBegin();
      return false;
    }
    _finish() {
      this.phase = "finished";
      const keys = this.players.map((p) => this.rankKey(p));
      this.players.forEach((p, i) => { p.place = 1 + keys.filter((k) => cmpArr(k, keys[i]) < 0).length; });
      const tops = this.players.filter((p) => p.place === 1);
      this.winner = tops[0].index;
      if (tops.length > 1) this._say("win", "cu_l_tie", "cu_s_tie", { names: tops.map((p) => p.name), score: tops[0].score });
      else this._say("win", "g_l_win", "g_s_win", { name: tops[0].name, game: this.MODE });
      this._effect("win", { player: this.winner });
    }
    _logDart(p, d) { this._say("muted", "g_l_dart", null, { name: p.name, label: d.label }); }

    summary() {
      if (this.phase !== "finished" || this.winner === null) return null;
      const ranked = this.players.slice().sort((a, b) => a.place - b.place || a.index - b.index);
      const keys = ["name", "place", "bot", "darts", "hits", "score", ...this.summaryExtra()];
      return { mode: this.MODE, winner: ranked.filter((q) => q.place === 1).map((q) => q.name).join(" & "),
        rounds: this.turn_no, settings: { ...this.settings },
        players: ranked.map((q) => Object.fromEntries(keys.map((k) => [k, q[k]]))) };
    }
    state(lang) {
      const st = this._baseState(lang);
      lang = st.lang;
      const cur = this.current;
      const playing = this.phase === "play" && cur !== null;
      st.waiting = playing && (this.turn_over || this.turn_darts.length >= DARTS);
      st.rounds = this.roundsTotal();
      st.target = playing ? this.target(this.players[cur]) : null;
      let instr = null, route = null;
      if (playing) {
        const p = this.players[cur];
        if (st.waiting) instr = tr(lang, "i_takeout", { name: p.name });
        else {
          const [k, prm] = this.instr(p);
          instr = tr(lang, k, prm);
          route = this.checkoutRoute(p);
        }
      } else if (this.phase === "finished" && this.winner !== null) {
        const top = this.players.filter((p) => p.place === 1).map((p) => p.name);
        instr = top.length === 1 ? tr(lang, "i_win", { name: top[0] }) : tr(lang, "cu_i_tie", { names: top });
      }
      st.instruction = instr;
      st.checkout = route ? route.map((c) => labelText(lang, c)) : null;
      st.info = this.info().map(([k, prm]) => tr(lang, k, prm)).join("");
      const [rk, rp] = this.roundLabel();
      st.round_label = this.phase === "play" ? tr(lang, rk, rp) : tr(lang, "g_rp_over");
      st.views = this.players.map((p) => {
        const v = this.view(p);
        return { big: v.big, meta: v.meta.map(([k, prm]) => tr(lang, k, prm)), badge: v.badge ? tr(lang, v.badge) : null,
          dim: p.out || (p.done && this.phase === "play") };
      });
      st.highlight = playing ? this.highlight() : { nums: [], bull: false };
      st.table = this.table();
      return st;
    }
  }

  // ============================================================ Rond de klok
  class AroundClock extends TurnGame {
    get MODE() { return "atc"; }
    defaultSettings() { return { zone: "any", bull: true, jump: false }; }
    cleanSettings(d) {
      d = d || {};
      return { zone: en(d, "zone", "any", ["any", "double", "triple"]), bull: bool(d, "bull", true), jump: bool(d, "jump", false) };
    }
    playerExtra() { return { pos: 1, finish: null }; }
    _last() { return this.settings.bull ? 21 : 20; }
    target(p) {
      if (p.done) return null;
      if (p.pos === 21) return { t: "bull", n: 25 };
      return { t: { any: "num", double: "dbl", triple: "trp" }[this.settings.zone], n: p.pos };
    }
    onDart(p, d) {
      const t = this.target(p);
      if (!hits(d, t)) { this._logDart(p, d); return; }
      const step = this.settings.jump && t.t === "num" ? d.multiplier : 1;
      p.hits += 1;
      p.pos = Math.min(this._last() + 1, p.pos + step);
      p.score = p.pos - 1;
      if (p.pos > this._last()) {
        p.done = true; p.won = true; p.finish = p.darts;
        this.turn_over = true;
        this._say("win", "atc_l_done", null, { name: p.name, darts: p.darts });
        this._finish();
        return;
      }
      this._say("good", "g_l_hit_next", null, { name: p.name, label: d.label, tgt: this.target(p) });
    }
    rankKey(p) { return [p.done ? 0 : 1, -p.pos, p.darts]; }
    info() {
      const out = [["atc_info_" + this.settings.zone, {}]];
      if (this.settings.bull) out.push(["atc_info_bull", {}]);
      if (this.settings.jump && this.settings.zone === "any") out.push(["atc_info_jump", {}]);
      return out;
    }
    view(p) {
      return { big: p.done ? "✓" : targetText("nl", this.target(p)),
        meta: [["v_progress", { n: p.pos - 1, total: this._last() }], ["v_darts", { n: p.darts }]], badge: null };
    }
    summaryExtra() { return ["finish"]; }
  }

  // ================================================================ Shanghai
  class Shanghai extends TurnGame {
    get MODE() { return "shanghai"; }
    get SCORE_CALL() { return true; }
    defaultSettings() { return { rounds: 7, instant: true }; }
    cleanSettings(d) {
      d = d || {};
      const r = intOf(d, "rounds", 7);
      if (![7, 10, 20].includes(r)) throw new GameError("err_settings");
      return { rounds: r, instant: bool(d, "instant", true) };
    }
    playerExtra() { return { shanghai: false }; }
    roundsTotal() { return this.settings.rounds; }
    target() { return { t: "num", n: this.turn_no }; }
    onDart(p, d) {
      const n = this.turn_no;
      if (d.isMiss || d.number !== n) { this._logDart(p, d); return; }
      const pts = n * d.multiplier;
      p.score += pts; p.hits += 1; this.turn_score += pts;
      this._say("good", "g_l_score", null, { name: p.name, label: d.label, score: p.score });
      const mults = new Set(this.turn_darts.filter((x) => x.number === n && !x.isMiss).map((x) => x.multiplier));
      if (this.settings.instant && mults.has(1) && mults.has(2) && mults.has(3)) {
        p.shanghai = true; p.won = true;
        this.turn_over = true;
        this._say("win", "sh_l_shanghai", "sh_s_shanghai", { name: p.name });
        this._finish();
      }
    }
    rankKey(p) { return [p.won ? 0 : 1, -p.score]; }
    info() { return [["sh_info", {}], [this.settings.instant ? "sh_info_instant" : "sh_info_noinstant", {}]]; }
    view(p) { return { big: p.score, meta: [["v_hits", { n: p.hits }]], badge: null }; }
    summaryExtra() { return ["shanghai"]; }
  }

  // ================================================================ Bob's 27
  class Bobs27 extends TurnGame {
    get MODE() { return "bobs27"; }
    defaultSettings() { return { bull: true, negative: false }; }
    cleanSettings(d) { d = d || {}; return { bull: bool(d, "bull", true), negative: bool(d, "negative", false) }; }
    playerExtra() { return { out_round: null }; }
    setup() { for (const p of this.players) p.score = 27; }
    roundsTotal() { return this.settings.bull ? 21 : 20; }
    _n() { return this.turn_no === 21 ? 25 : this.turn_no; }
    target() { return { t: "dbl", n: this._n() }; }
    _value() { return this._n() === 25 ? 50 : 2 * this._n(); }
    onDart(p, d) {
      if (!hits(d, this.target(p))) { this._logDart(p, d); return; }
      p.score += this._value(); p.hits += 1; this.turn_hits += 1;
      this._say("good", "g_l_score", null, { name: p.name, label: d.label, score: p.score });
    }
    onTurnEnd(p) {
      if (this.turn_hits) return;
      p.score -= this._value();
      this._say("hit", "b27_l_minus", null, { name: p.name, v: this._value(), score: p.score });
      if (p.score < 0 && !this.settings.negative) {
        p.out = true; p.out_round = this.turn_no;
        this._say("out", "b27_l_out", "s_out", { name: p.name, by: "" });
      }
    }
    rankKey(p) { return p.out ? [1, -p.out_round, -p.score] : [0, -p.score, 0]; }
    info() { return [["b27_info", {}], [this.settings.negative ? "b27_info_neg" : "b27_info_out", {}]]; }
    view(p) { return { big: p.score, meta: [["v_hits", { n: p.hits }]], badge: p.out ? "badge_out" : null }; }
    summaryExtra() { return ["out_round"]; }
  }

  // ================================================================ Halve-It
  const HALVE_SEQ = [{ t: "num", n: 15 }, { t: "num", n: 16 }, { t: "any_d" }, { t: "num", n: 17 },
    { t: "num", n: 18 }, { t: "any_t" }, { t: "num", n: 19 }, { t: "num", n: 20 }, { t: "bull", n: 25 }];

      const s = intOf(d || {}, "start", 0);

    }
    setup() { for (const p of this.players) p.score = this.settings.start; }
